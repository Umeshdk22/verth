  const rim1 = new THREE.PointLight(0x1fe0c8, 60, 30); rim1.position.set(-6, 3, -3); scene.add(rim1);

  for (let i = 0; i < 3000; i++) { sp[i * 3] = (rnd() - .5) * 120; sp[i * 3 + 1] = (rnd() - .5) * 120; sp[i * 3 + 2] = -80 + rnd() * 140; }

  stars = new THREE.Points(sg, new THREE.PointsMaterial({ size: .22, color: 0xcfd8ff, map: glowTex('#ffffff'), transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
  scene.add(stars);
  [['#6b3df0', -18, 10, -45, 70], ['#0e8c7e', 20, -6, -50, 70], ['#d9498f', 4, 22, -60, 60]].forEach(([c, x, y, z, s]) => { const n = glow(c, s); n.material.opacity = .55; n.position.set(x, y, z); scene.add(n); });
  const grid = new THREE.GridHelper(160, 80, 0x1fe0c8, 0x6b3df0); grid.position.y = -5.2; grid.material.transparent = true; grid.material.opacity = .35; scene.add(grid);
  const wg = new THREE.BufferGeometry(), wp = new Float32Array(400 * 6);
  for (let i = 0; i < 400; i++) { const x = (rnd() - .5) * 40, y = (rnd() - .5) * 60, z = -20 + rnd() * 70, l = 2 + rnd() * 6; wp.set([x, y, z, x, y, z - l], i * 6); }
  wg.setAttribute('position', new THREE.BufferAttribute(wp, 3));
  warp = new THREE.LineSegments(wg, new THREE.LineBasicMaterial({ color: 0x9fdfff, transparent: true, opacity: 0, blending: THREE.AdditiveBlending })); scene.add(warp);

  phone = makePhone(); scene.add(phone);
  robot = makeRobot(); scene.add(robot);
  ring = new THREE.Mesh(new THREE.RingGeometry(.8, 1.0, 64), new THREE.MeshBasicMaterial({ color: 0x4FE3CF, transparent: true, blending: THREE.AdditiveBlending, side: THREE.DoubleSide, depthWrite: false })); ring.rotation.x = -Math.PI / 2; scene.add(ring);

  shield.add(shieldLines); shield.position.copy(SC); scene.add(shield);
  for (let i = 0; i < NB; i++) { const b = makeBlock(i); b.userData = { a: i / NB * Math.PI * 2 + .35, h: [-1.4, 2.2, .4, 2.8, -2.4, 1.4, -.6][i], r0: 6.0 + (i % 2) * .7 }; blocks.push(b); scene.add(b); const bm = makeBoom(); booms.push(bm); scene.add(bm.g); }

  const font = new FontLoader().parse(await (await fetch('./vendor/three/helvetiker_bold.typeface.json')).json());
  logo = new THREE.Group();
  const mk = (s, col, em) => { const g = new TextGeometry(s, { font, size: .9, height: .32, curveSegments: 10, bevelEnabled: true, bevelThickness: .06, bevelSize: .04, bevelSegments: 4 }); g.computeBoundingBox(); return new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: col, emissive: em, emissiveIntensity: .7, metalness: .55, roughness: .25 })); };
  const ver = mk('VER', 0xa98bff, 0x4b2bc9), th = mk('TH', 0x3de0c8, 0x0a7a6e);

  ver.position.x = -tot / 2; th.position.x = -tot / 2 + wv + gap; logo.add(ver, th);
  logo.children.forEach((m) => m.position.y = -.45);
  const lg = glow('#8a63ff', 9); lg.position.z = -1; lg.material.opacity = .5; logo.add(lg);
  logo.position.set(0, 7.3, 0); scene.add(logo);
  for (let i = 0; i < 3; i++) {
    const c = new THREE.Group();
    const body = new THREE.Mesh(new THREE.ExtrudeGeometry(rr(2.8, 1.4, .25), { depth: .1, bevelEnabled: true, bevelThickness: .04, bevelSize: .04, bevelSegments: 3 }).translate(0, 0, -.05), new THREE.MeshStandardMaterial({ color: 0x14204a, metalness: .6, roughness: .3 }));
    const face = new THREE.Mesh(fixUV(new THREE.ShapeGeometry(rr(2.8, 1.4, .25), 8), 2.8, 1.4), new THREE.MeshBasicMaterial({ map: cardTex(i), toneMapped: false, transparent: true })); face.position.z = .09;
    c.add(body, face); scene.add(c); cards.push(c);

};

function camAt(t) {
  const a = .26 * Math.sin(t * .32) + (t > 21 ? .22 * Math.sin((t - 21) * .9) : 0);
  const Rr = t < 3 ? lerp(44, 13.5, eio(p(t, 0, 3))) : lerp(lerp(13.5, 15.5, eio(p(t, 11, 12.5))), 13.5, eio(p(t, 16, 17.8)));
  const ty = lerp(.4, 5.2, eio(p(t, 16, 17.8)));
  let shake = 0; if (t > 4 && t < 9.5) shake = .05 * Math.sin(t * 47) * p(t, 4, 5);
  for (let i = 0; i < NB; i++) { const d = t - (HIT0 + i * HITD); if (d > 0 && d < .25) shake += .12 * (1 - d / .25) * Math.sin(d * 90); }
  if (Math.abs(t - 10.15) < .3) shake += .15 * (1 - Math.abs(t - 10.15) / .3) * Math.sin(t * 80);
  camera.position.set(Rr * Math.sin(a) + shake, ty + .9 + shake * .6, Rr * Math.cos(a));
  camera.lookAt(0, ty, 0);
  camera.rotation.z += t < 3 ? (1 - eio(p(t, 0, 3))) * .35 : 0;
}

function blockPos(i, t, out) {
  const u = blocks[i].userData, ap = 3.0 + i * .55;
  const r = lerp(28, u.r0, eo(p(t, ap, ap + 2.6))) + 1.6 * eo(p(t, 9.6, 10.8));
  const ang = u.a + .28 * (t - 3);
  return out.set(r * Math.cos(ang), .8 + u.h + .25 * Math.sin(t * 1.7 + i), Math.min(2.2, r * Math.sin(ang) * .5));
}
const v1 = new THREE.Vector3(), v2 = new THREE.Vector3(), v3 = new THREE.Vector3();

window.render = (t) => {
  camAt(t);
  // warp + stars
  warp.material.opacity = .7 * (1 - p(t, 1.8, 3));
  // phone
  const ph = eio(p(t, 16, 17.8));
  phone.position.set(lerp(0, 0, ph), .8 + .1 * Math.sin(t * 1.3) + lerp(0, 2.2, ph), lerp(0, -7, ph));
  phone.rotation.set(.05 * Math.sin(t), .28 * Math.sin(t * .5) + (t > 4 && t < 9.5 ? .03 * Math.sin(t * 40) : 0), 0);
  phone.visible = t < 26.5;
  drawScreen(t); screenTex.needsUpdate = true;
  // lights
  redLight.intensity = t > 3.6 && t < 11.6 ? 40 * (.6 + .4 * Math.sin(t * 9)) * p(t, 3.6, 4.4) * (1 - p(t, 11, 11.6)) : 0;
  tealLight.intensity = 50 * p(t, 9.8, 10.6);
  // robot
  const land = eb(p(t, 9.0, 10.15)), up = eio(p(t, 16.2, 17.8));
  const base = new THREE.Vector3(0, lerp(14, -2.7, clamp(land, 0, 1.1)), 2.4);
  base.lerp(new THREE.Vector3(0, 2.75, 2.6), up);
  robot.position.copy(base); robot.position.y += t > 10.15 ? .12 * Math.sin(t * 2.2) : 0;
  robot.visible = t > 8.9;
  const rs = lerp(1, .82, up); robot.scale.setScalar(rs);
  robot.rotation.y = .25 * Math.sin(t * .7) * p(t, 10.4, 11);
  const raise = eb(p(t, 11.0, 11.5)) * (1 - eio(p(t, 15.2, 15.8)));
  let wave = 0; if (t > 26.2) wave = eo(p(t, 26.2, 26.7));
  R.arms[0].rotation.z = -(.15 + 2.5 * raise);
  R.arms[1].rotation.z = .15 + 2.5 * raise + wave * (2.3 + .45 * Math.sin((t - 26.2) * 9));
  R.arms[0].rotation.x = R.arms[1].rotation.x = -.2 * raise;
  const bl = (t % 2.9) < .13 ? .15 : 1; R.eyes.forEach((e) => e.scale.y = bl);
  R.head.rotation.z = .08 * Math.sin(t * 1.1); R.head.rotation.x = -.08 * Math.sin(t * .8);
  R.jet.material.opacity = .7 + .3 * Math.sin(t * 30); R.jet2.material.opacity = .5 + .2 * Math.sin(t * 23);
  ring.position.set(0, -3.5, 2.4); const rk = p(t, 10.12, 10.9); ring.scale.setScalar(.3 + rk * 6); ring.material.opacity = rk > 0 && rk < 1 ? (1 - rk) : 0;
  // shield
  const sk = eb(p(t, 11.3, 11.9)) * (1 - eio(p(t, 15.4, 16.2)));
  shield.visible = sk > .001; shield.scale.setScalar(Math.max(.001, sk)); shield.rotation.y = t * .25; shield.rotation.x = t * .1;
  let hitFlash = 0; for (let i = 0; i < NB; i++) { const d = t - (HIT0 + i * HITD); if (d > 0 && d < .35) hitFlash = Math.max(hitFlash, 1 - d / .35); }
  shield.material.opacity = .07 + .25 * hitFlash; shieldLines.material.opacity = .45 + .5 * hitFlash;
  // blocks + booms
  for (let i = 0; i < NB; i++) {
    const b = blocks[i], hT = HIT0 + i * HITD, lT = hT - .55, ap = 3.0 + i * .55;
    b.visible = t > ap && t < hT;
    if (t < lT) blockPos(i, t, b.position);
    else { blockPos(i, lT, v1); v2.copy(v1).sub(SC).normalize().multiplyScalar(SR).add(SC); b.position.copy(v1).lerp(v2, ei(p(t, lT, hT))); }
    b.lookAt(camera.position); b.rotateZ(.15 * Math.sin(t * 2 + i)); b.rotateY(.25 * Math.sin(t * 1.3 + i * 2));
    const s = eb(p(t, ap, ap + .6)); b.scale.setScalar(Math.max(.001, s * (t > 4 ? 1 + .04 * Math.sin(t * 8 + i) : 1)));
    const bm = booms[i], d = t - hT;

    if (bm.g.visible) {

      const pos = bm.pts.geometry.attributes.position;
      for (let k = 0; k < bm.dirs.length; k++) { const [x, y, z] = bm.dirs[k], f = 1 - Math.exp(-d * 2.2); pos.setXYZ(k, x * f * .6, y * f * .6 - 1.2 * d * d, z * f * .6); }
      pos.needsUpdate = true; bm.pts.material.opacity = 1 - p(d, 0, 1.2);
      bm.fl.scale.setScalar(.5 + 5 * eo(p(d, 0, .25))); bm.fl.material.opacity = 1 - p(d, 0, .35);
      bm.ring.scale.setScalar(1 + 6 * eo(p(d, 0, .5))); bm.ring.material.opacity = .8 * (1 - p(d, 0, .5));
      bm.lab.position.y = .6 + .9 * eo(p(d, 0, 1)); bm.lab.material.opacity = eo(p(d, 0, .15)) * (1 - p(d, 1.4, 2.0)); bm.lab.scale.set(2.2 * eb(p(d, 0, .3)) + .001, .69 * eb(p(d, 0, .3)) + .001, 1);
    }
  }
  // logo
  const lk = eo(p(t, 16.6, 18.0));
  logo.visible = t > 16.5; logo.scale.setScalar(Math.max(.001, lerp(.2, 1, lk))); logo.position.y = lerp(4.5, 7.3, lk);
  logo.rotation.y = lerp(-Math.PI * 1.2, 0, lk) + .12 * Math.sin(t * .9); logo.rotation.x = .05 * Math.sin(t * .7);
  // cards
  cards.forEach((c, i) => {
    const ck = eb(p(t, 21.3 + i * .35, 21.8 + i * .35)) * (1 - eio(p(t, 25.6, 26.2)));
    c.visible = ck > .001; c.scale.setScalar(Math.max(.001, ck));
    const ang = i * Math.PI * 2 / 3 + (t - 21) * .55 - .4;
    c.position.set(3.3 * Math.sin(ang), 3.2 + .5 * Math.sin(ang * 2 + t), 2.6 + 2.4 * Math.cos(ang));
    c.lookAt(camera.position);
  });
  renderer.render(scene, camera);
  ui(t);
};

function show(id, t, a, b, d = .45) { const k = eo(p(t, a, a + d)) * (1 - p(t, b - .35, b)); const el = $(id); el.style.opacity = k; el.style.transform = `translateY(${(1 - eo(p(t, a, a + d))) * 40}px) scale(${lerp(1.06, 1, eo(p(t, a, a + d)))})`; return k; }
function ui(t) {
  show('t1', t, 1.1, 3.4); show('t2', t, 4.2, 8.9); show('t3', t, 9.8, 11.3); show('t4', t, 11.6, 16.0);
  show('t5', t, 17.6, 20.9); show('t6', t, 21.2, 25.9); show('t7', t, 26.6, 99);
  let n = 0; for (let i = 0; i < NB; i++) if (t >= HIT0 + i * HITD) n++;
  const ck = eo(p(t, 11.8, 12.2)) * (1 - p(t, 15.8, 16.2)); $('count').style.opacity = ck; $('count').textContent = T.count + n;
  $('count').style.transform = `translateX(-50%) scale(${1 + .08 * Math.max(0, 1 - ((t - HIT0) % HITD) * 6) * (t > HIT0 && t < HIT0 + NB * HITD)})`;
  const u = eb(p(t, 27.0, 27.4)); $('url').style.opacity = clamp(u * 2); $('url').style.transform = `scale(${lerp(.5, 1, u)})`;
  $('urlT').textContent = 'verth.in'.slice(0, Math.floor(9 * p(t, 27.3, 28.0)));
  const s = eb(p(t, 28.3, 28.7)); $('subWrap').style.opacity = clamp(s * 2); $('subWrap').style.transform = `scale(${lerp(.5, 1, s)})`;
  const hd = eio(p(t, 28.9, 29.4)), tap = p(t, 29.45, 29.7);
  $('hand').style.opacity = clamp(hd * 3) * (1 - p(t, 30.4, 30.8));
  $('hand').style.transform = `translate(${(1 - hd) * 200}px, ${(1 - hd) * 220 - 30 * Math.sin(Math.PI * tap)}px)`;
  const subd = t >= 29.58; $('subBtn').textContent = subd ? 'SUBSCRIBED 🔔' : 'SUBSCRIBE'; $('subBtn').style.background = subd ? '#3A3550' : '#E62117';
  let fl = 0; [[10.15, .5], [11.35, .4], [16.6, .3]].forEach(([f, a]) => { if (t >= f && t < f + .35) fl = Math.max(fl, a * (1 - (t - f) / .35)); });
  $('flash').style.opacity = fl;

window.total = () => 31.4;
window.sfx = () => {
  const e = [['whoosh', .05], ['whoosh', .9], ['stamp', 2.9]];
  for (let i = 0; i < NB; i++) e.push([i % 2 ? 'buzz' : 'ping', 3.0 + i * .55 + .2]);
  e.push(['alarm', 5.2], ['alarm', 7.4], ['whoosh', 9.0], ['stamp', 10.15], ['sparkle', 11.3]);
  for (let i = 0; i < NB; i++) e.push(['stamp', HIT0 + i * HITD], ['pop', HIT0 + i * HITD + .05]);
  e.push(['tada', 15.1], ['whoosh', 16.3], ['sparkle', 17.0], ['ding', 17.9], ...[0, 1, 2].map((i) => ['pop', 21.35 + i * .35]), ['whoosh', 26.0], ['sparkle', 27.0], ['pop', 28.35], ['pop', 29.55], ['tada', 29.65]);
