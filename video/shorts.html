  document.querySelectorAll('.pin').forEach((d) => { const on = t > LS(2) + (L[2].end - L[2].start) * (0.45 + d.dataset.k * 0.1) && d.dataset.k < 4; d.style.background = on ? '#111' : 'transparent'; });
  const ct = $('calltime'); if (ct) { const s = Math.max(0, Math.floor(t - 0.3)); ct.textContent = `00:${String(s).padStart(2, '0')}`; }
  const rec = $('rec'); if (rec) rec.style.opacity = Math.floor(t * 2) % 2 ? 1 : .2;
  const lost = $('lost'); if (lost) { const p = easeOut((t - LS(3) - 0.2) / 2.2); const v = Math.round(p * 12000000); lost.textContent = '₹' + v.toLocaleString('en-IN'); }
  const gl = $('gl'); if (gl) { const j = Math.floor(t * 18) % 7 === 0 ? 8 : 2; gl.style.textShadow = `${j}px 0 #E11D2E, ${-j}px 0 #2563EB`; }
  const fl = $('flash'); if (fl) { fl.style.opacity = t > LS(4) ? Math.max(0, 1 - (t - LS(4)) / 0.45) : 0; }
  const fg = $('finger'); if (fg && t > fg._t) { const u = clamp((t - fg._t) / 1.2); fg.style.transform = `translate(${-60 * ease(u)}px, ${-40 * ease(u)}px)`; }
  const tp = $('tap'); if (tp && t > tp._t) { const u = clamp((t - tp._t) / 0.6); tp.style.transform = `translate(${-20 * u}px, ${-30 * u}px)`; const nb = $('nobtn'); if (nb) nb.style.transform = u >= 1 ? 'scale(.96)' : ''; }
  const pk = $('packet'); if (pk && t > pk._t) { const u = ease((t - pk._t) / 1.4); pk.style.left = (330 + 300 * u) + 'px'; pk.style.opacity = u < .95 ? 1 : 1 - (u - .95) * 20; }
  const bz = $('buzz'); if (bz && t > bz._t) bz.style.transform += ` rotate(${Math.sin(t * 60) * 6 * (Math.floor(t * 2) % 2)}deg)`;
  const rg = $('ringer'); if (rg && t > rg._t) rg.style.boxShadow = `0 0 0 ${20 + 30 * ((t * 1.5) % 1)}px rgba(255,255,255,${.35 * (1 - (t * 1.5) % 1)})`;
  document.querySelectorAll('.fly').forEach((f) => { const u = (t - f._t - f.dataset.k * 0.18) % 1.6 / 1.6; if (t < f._t) return; f.style.opacity = u < 0 ? 0 : 1 - u; f.style.transform = `translate(${160 * u}px, ${-120 * u + 40 * Math.sin(u * 6 + +f.dataset.k)}px)`; });
  // captions: the spoken line, words lighting up as they're said
  const cap = $('cap'); let on = -1;
  for (let i = 0; i < L.length; i++) if (t >= L[i].start - 0.12 && t <= L[i].end + 0.3) on = i;
  if (on >= 0 && on < last) {
    const ln = L[on];
    if (cap._n !== on) { cap._n = on; cap.innerHTML = ln.text.split(/\s+/).map((w) => `<span${(V.keys[on] && w.toLowerCase().includes(V.keys[on].toLowerCase().split(' ')[0])) ? ' class="k"' : ''}>${w}</span>`).join(' '); cap._w = [...cap.children]; }
    const frac = (t - ln.start) / Math.max(.1, ln.end - ln.start), n = cap._w.length;
    // words light up by their share of the letters, so long words take longer
    const lens = cap._w.map((w) => w.textContent.length + 1), tot = lens.reduce((x, y) => x + y, 0); let acc = 0;
    cap._w.forEach((w, k) => { acc += lens[k]; w.classList.toggle('on', acc / tot <= frac + 0.08 || k === 0); });
    cap.style.opacity = Math.min(ease((t - ln.start + 0.12) / 0.15), 1 - ease((t - ln.end - 0.15) / 0.15));
  } else cap.style.opacity = 0;
};
