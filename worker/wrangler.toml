# Verth payments worker. Deploy from the Cloudflare dashboard (paste src/index.js) or with:
#   npx wrangler deploy
name = "verth-pay"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
FIREBASE_PROJECT_ID = "verth-ece65"
ALLOWED_ORIGIN = "https://verth.in,https://www.verth.in,https://umeshdk22.github.io"
# Razorpay plan IDs (Dashboard → Subscriptions → Plans). Plan IDs are not secret.
PLAN_PERSONAL = "plan_REPLACE_PERSONAL"
PLAN_FAMILY = "plan_REPLACE_FAMILY"
PLAN_TEAM = "plan_REPLACE_TEAM"
# The address sign-in codes come from (verified as a sender in Brevo).
MAIL_FROM = "REPLACE_WITH_SENDER_EMAIL"
# Reminder notifications: public VAPID key (same as src/config.js PUSH.publicKey).
VAPID_PUBLIC_KEY = "BAUtyo84fLR3vgVwW1dSyTVRpTSZOx3c0l17WUcLPMc-3qoU_CLrNL3_gxILsmKU7JmSiSAgA7Z9_6SWkJJWAyE"

# Secrets are NOT stored here. Add them with `npx wrangler secret put NAME` or in the dashboard
# (Worker → Settings → Variables and Secrets → type "Secret"):
#   RAZORPAY_KEY_ID, RAZORPAY_KEY_SECRET, RAZORPAY_WEBHOOK_SECRET, FIREBASE_SERVICE_ACCOUNT,
#   BREVO_API_KEY (Brevo → SMTP & API → API keys), OTP_SECRET (any long random text),
#   GEMINI_API_KEY (optional, aistudio.google.com → Get API key) for AI answers in Verth Helper
#   VAPID_PRIVATE_KEY (optional) for reminder notifications

# Every hour: reminder notifications and "come back" emails (runNudges in src/index.js).
[triggers]
crons = ["0 * * * *"]
