# Used by GitHub Actions to publish the worker code automatically.
# keep_vars keeps every setting you entered in the Cloudflare dashboard (plan IDs, sender email,
# allowed origin…). Secrets are never touched by a deploy.
name = "verth-pay"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true
keep_vars = true

# Websites the Verth app runs on. Set here (not only in the dashboard) so a new address goes live with the code.
[vars]
ALLOWED_ORIGIN = "https://verth.in,https://www.verth.in,https://umeshdk22.github.io"
# Razorpay's website review is finished, so its test login is switched off for good.
# (To use it again, put the address back here and set the REVIEW_CODE secret in Cloudflare.)
REVIEW_EMAIL = ""
# Reminder notifications (Web Push): the public half of the VAPID key, the same as PUSH.publicKey in
# src/config.js. The private half is the VAPID_PRIVATE_KEY secret (Cloudflare → Variables and Secrets).
VAPID_PUBLIC_KEY = "BAUtyo84fLR3vgVwW1dSyTVRpTSZOx3c0l17WUcLPMc-3qoU_CLrNL3_gxILsmKU7JmSiSAgA7Z9_6SWkJJWAyE"

# Every 5 minutes: reminders at each person’s chosen time, alerts and announcements, and "come back" emails at 6 pm India time.
[triggers]
crons = ["*/5 * * * *"]
