name: Security tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules:
    name: Database security rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Run rules tests against the Firestore emulator
        run: npx --yes firebase-tools@15.32.0 emulators:exec --only firestore --project demo-verth "node --test test/rules.test.mjs"

  app:
    name: Two-person app test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Scam check unit tests (real-world examples)
        run: npm run test:unit
      - run: npx playwright install --with-deps chromium
      - name: Run browser test (employee, CEO and attacker scenarios)
        run: bash test/run-e2e.sh test-output
