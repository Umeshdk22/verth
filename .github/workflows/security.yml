name: Security tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules:
    name: Database security rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Run rules tests against the Firestore emulator
        run: npx --yes firebase-tools@15.32.0 emulators:exec --only firestore --project demo-verth "node --test --test-reporter=./test/gh-reporter.mjs test/rules.test.mjs"

  app:
    name: Two-person app test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Scam check unit tests (real-world examples)
        run: npm run test:unit
      - run: npx playwright install --with-deps chromium
      - name: Run browser test (employee, CEO and attacker scenarios)
        run: bash test/run-e2e.sh test-output

  # Publishes the database rules and the server code after BOTH test jobs pass on main.
  # Each step does nothing until its secret is added in GitHub (Settings → Secrets → Actions).
  publish:
    name: Publish rules and server
    needs: [rules, app]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: 22
      - name: Publish Firestore security rules
        env:
          DEPLOY_KEY: ${{ secrets.FIREBASE_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then echo "::notice title=Rules not published::Add the FIREBASE_DEPLOY_KEY secret to publish rules automatically."; exit 0; fi
          umask 077; printf '%s' "$DEPLOY_KEY" > "$RUNNER_TEMP/key.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/key.json" node tools/publish_rules.mjs verth-ece65; code=$?
          rm -f "$RUNNER_TEMP/key.json"; exit $code
      - name: Publish the Cloudflare worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "::notice title=Worker not published::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to publish the worker automatically."; exit 0; fi
          npx --yes wrangler@4 deploy --config worker/wrangler.ci.toml
