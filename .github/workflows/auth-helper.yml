name: Fetch Google sign-in helper
# Run by hand to refresh the files. Downloads Firebase's sign-in helper pages so
# verth.in can serve them itself (phones block the cross-site version, so Google sign-in hangs).
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - name: Download
        run: |
          B=https://verth-ece65.firebaseapp.com
          mkdir -p __/auth
          get() { code=$(curl -sSL -w '%{http_code}' -o "$2" "$B$1"); echo "$1 -> $code $(wc -c < "$2")"; [ "$code" = 200 ] || rm -f "$2"; }
          get /__/auth/handler __/auth/handler.html
          get /__/auth/handler.js __/auth/handler.js
          get /__/auth/experiments.js __/auth/experiments.js
          get /__/auth/iframe __/auth/iframe.html
          get /__/auth/iframe.js __/auth/iframe.js
          ls -la __/auth __/firebase
          git add __
          git -c user.name=verth-bot -c user.email=verth-bot@users.noreply.github.com commit -m "Google sign-in helper pages, served from verth.in" || echo "no change"
          git push
