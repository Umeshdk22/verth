name: Fetch Google sign-in helper
# Runs when pushed to the fix/google-signin branch. Downloads Firebase's sign-in helper pages so
# verth.in can serve them itself (phones block the cross-site version, so Google sign-in hangs).
on:
  push:
    branches: [fix/google-signin]
    paths: [.github/workflows/auth-helper.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - name: Download
        run: |
          set -e
          B=https://verth-ece65.firebaseapp.com
          mkdir -p __/auth __/firebase
          curl -fsSL $B/__/auth/handler -o __/auth/handler.html
          curl -fsSL $B/__/auth/handler.js -o __/auth/handler.js
          curl -fsSL $B/__/auth/experiments.js -o __/auth/experiments.js
          curl -fsSL $B/__/auth/iframe -o __/auth/iframe.html
          curl -fsSL $B/__/auth/iframe.js -o __/auth/iframe.js
          curl -fsSL $B/__/firebase/init.json -o __/firebase/init.json
          ls -la __/auth __/firebase
          git add __
          git -c user.name=verth-bot -c user.email=verth-bot@users.noreply.github.com commit -m "Google sign-in helper pages, served from verth.in" || echo "no change"
          git push
