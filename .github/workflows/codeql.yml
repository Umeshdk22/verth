name: Code scanning (CodeQL)
# GitHub's security scanner reads all the JavaScript (app, server, tests) and reports
# injection, XSS, unsafe crypto and other weaknesses under Security → Code scanning.
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  schedule: [{ cron: '23 3 * * 1' }]
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with: { category: '/language:javascript' }
